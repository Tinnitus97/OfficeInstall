name: Veröffentlichen

# Zwei getrennte Stände, zwei Arten von Etiketten (Tags):
#
#   v1.0.1        -> das Programm. Baut die EXE und hängt sie an die
#                    Veröffentlichung. Die Versionsnummer muss mit <Version>
#                    in der .csproj übereinstimmen.
#   configs-70    -> die Konfigurationsdateien. Packt package/ zu configs.zip.
#                    Die Zahl ist der Paketstand, den das Programm anzeigt.
#
# Beide Wege schreiben danach update.json im Zweig main fort - das ist die
# Datei, die das Programm abfragt.

on:
  push:
    tags:
      - 'v*'
      - 'configs-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  programm:
    if: startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version aus dem Tag ableiten
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

          # Gegenprobe: Steht in der Projektdatei dieselbe Nummer?
          $csproj = Get-ChildItem -Recurse -Filter 'OfficeInstall.csproj' | Select-Object -First 1
          $inFile = ([xml](Get-Content $csproj.FullName)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($inFile -ne $version) {
            Write-Host "::error::Tag $version passt nicht zu <Version>$inFile</Version> in $($csproj.Name)."
            exit 1
          }
          "csproj=$($csproj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Kompilieren
        shell: pwsh
        run: |
          dotnet publish '${{ steps.version.outputs.csproj }}' `
            -c Release -r win-x64 -o publish `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false
          if (-not (Test-Path 'publish/OfficeInstall.exe')) { throw 'EXE wurde nicht erzeugt.' }

      - name: Prüfsumme bilden
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/OfficeInstall.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash *OfficeInstall.exe" | Out-File publish/SHA256SUMS.txt -Encoding ascii

      - name: Veröffentlichung anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: OfficeInstall ${{ steps.version.outputs.version }}
          files: |
            publish/OfficeInstall.exe
            publish/SHA256SUMS.txt
          generate_release_notes: true

      - name: update.json fortschreiben
        shell: pwsh
        run: |
          python tools/write-update-json.py `
            --program-version '${{ steps.version.outputs.version }}' `
            --program-sha256  '${{ steps.hash.outputs.sha256 }}' `
            --repo '${{ github.repository }}' `
            --tag  '${{ github.ref_name }}'

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "update.json: Programm ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

  konfigurationen:
    if: startsWith(github.ref_name, 'configs-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Nichts wird veröffentlicht, was die Prüfung nicht besteht.
      - name: Konfigurationsdateien prüfen
        run: python tools/validate-configs.py package

      - name: Paket schnüren
        id: paket
        run: |
          STAND="${GITHUB_REF_NAME#configs-}"
          DATUM=$(date +%d.%m.%Y)

          mkdir -p build/Versionscheck
          cp -r package/x32 package/x64 build/
          printf '%s|%s' "$STAND" "$DATUM" > build/Versionscheck/Version.txt

          cd build && zip -r -q ../configs.zip . && cd ..
          HASH=$(sha256sum configs.zip | cut -d' ' -f1)
          echo "$HASH *configs.zip" > SHA256SUMS.txt

          echo "stand=$STAND"   >> "$GITHUB_OUTPUT"
          echo "datum=$DATUM"   >> "$GITHUB_OUTPUT"
          echo "sha256=$HASH"   >> "$GITHUB_OUTPUT"

      - name: Veröffentlichung anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Konfigurationen ${{ steps.paket.outputs.stand }}
          files: |
            configs.zip
            SHA256SUMS.txt
          body: |
            Konfigurationsdateien, Paketstand ${{ steps.paket.outputs.stand }}
            vom ${{ steps.paket.outputs.datum }}.

            Enthält `x32\`, `x64\` und `Versionscheck\Version.txt`.
            Der Offline-Bestand (`Office\Data`) ist **nicht** enthalten und wird
            beim Einspielen auch nicht angefasst.

      - name: update.json fortschreiben
        run: |
          python tools/write-update-json.py \
            --configs-version '${{ steps.paket.outputs.stand }}' \
            --configs-date    '${{ steps.paket.outputs.datum }}' \
            --configs-sha256  '${{ steps.paket.outputs.sha256 }}' \
            --repo '${{ github.repository }}' \
            --tag  '${{ github.ref_name }}'

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: Konfigurationen ${{ steps.paket.outputs.stand }}"
          git push origin HEAD:main
